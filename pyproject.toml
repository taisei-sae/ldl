[project]
name = "ldl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "opencv-python>=5.0.0.93",
    "tensorboard>=2.21.0",
    "torch>=2.14.1",
    "torchinfo>=1.8.0",
    "torchvision>=0.29.1",
]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu132"}
torchvision = { index = "pytorch-cu132" }
